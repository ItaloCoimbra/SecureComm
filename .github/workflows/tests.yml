name: Tests and packaging

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            setup.py
            pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline unit and distribution tests
        run: python -m pytest tests -q
      - name: Build source and wheel distributions
        run: python -m build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install isolated Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Install pinned web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Typecheck, real WASM tests and build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install isolated browser test runtime
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Exercise two browser profiles against the real HTTP relay
        working-directory: web
        run: npm run test:e2e
      - name: Package the production web assets
        run: .venv/bin/python -m build
      - name: Build Linux runtime
        run: docker build -t securecomm-web:ci .
